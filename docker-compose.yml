# ============================================================
# NovaKart (React) — docker compose
# Up:    docker compose up -d --build
# Logs:  docker compose logs -f
# Down:  docker compose down
# App:   http://localhost:3000
# ============================================================

services:
  novakart:
    build:
      context: .
      dockerfile: Dockerfile
    image: novakart-react:latest
    container_name: novakart-react
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
